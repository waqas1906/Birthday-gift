<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>For Zainab ❤️</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Fraunces:ital,wght@0,600;1,500&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Background effects (hearts + petals are spawned by script.js) -->
<div id="fx" aria-hidden="true"></div>
<div id="flash"></div>
<div id="wipe"></div>

<!-- Music toggle (music only starts when she taps it) -->
<button id="musicBtn" aria-label="Play or pause music">🎵</button>
<audio id="bgm" loop></audio>

<!-- ============ PAGE 1: INVITATION ============ -->
<section class="page active" id="page1">
  <h1 class="script big">Hey Zainab! ❤️</h1>
  <p class="sub">I have something special for you...</p>

  <div class="camera" id="camera">
    <span class="flower f1">🌸</span><span class="flower f2">🌷</span>
    <span class="flower f3">🌼</span><span class="flower f4">💗</span>
    <div class="cam-top"><i class="cam-flash"></i><i class="cam-btn"></i></div>
    <div class="cam-body">
      <div class="cam-lens"><div class="cam-glass"></div></div>
      <div class="cam-screen"><span class="heartbeat">💖</span></div>
      <div class="cam-stripe"></div>
    </div>
  </div>

  <p class="question">DO YOU WANT A SURPRISE??</p>
  <div class="btn-row" id="btnRow">
    <button class="btn yes" id="yesBtn">YES!! 💗</button>
    <button class="btn no" id="noBtn">NO!!</button>
  </div>
  <p class="hint" id="noMsg"></p>
</section>

<!-- ============ PAGE 2: PASSWORD ============ -->
<section class="page stripes" id="page2">
  <p class="script waiting">Something special is waiting for you...</p>
  <div class="lock-layout">
    <div class="left">
      <svg class="heart-frame" viewBox="0 0 100 92" aria-label="Photo of Zainab">
        <defs>
          <clipPath id="heartClip" clipPathUnits="objectBoundingBox">
            <path d="M0.5,0.97 C0.1,0.65 0.0,0.45 0.0,0.3 C0.0,0.12 0.14,0.02 0.27,0.02 C0.38,0.02 0.46,0.08 0.5,0.18 C0.54,0.08 0.62,0.02 0.73,0.02 C0.86,0.02 1,0.12 1,0.3 C1,0.45 0.9,0.65 0.5,0.97Z"/>
          </clipPath>
        </defs>
        <g clip-path="url(#heartClip)" transform="scale(100,92)">
          <image id="heartPhoto" data-photo="0" href="" x="0" y="0" width="1" height="1" preserveAspectRatio="xMidYMid slice"/>
        </g>
        <path d="M50,89 C10,60 0,41 0,28 C0,11 14,2 27,2 C38,2 46,8 50,17 C54,8 62,2 73,2 C86,2 100,11 100,28 C100,41 90,60 50,89Z" fill="none" stroke="#ff7fa8" stroke-width="3"/>
      </svg>
      <div class="teddy" aria-hidden="true">
        <svg viewBox="0 0 120 130">
          <circle cx="28" cy="22" r="14" fill="#d9a07a"/><circle cx="92" cy="22" r="14" fill="#d9a07a"/>
          <circle cx="28" cy="22" r="7" fill="#f6c9b0"/><circle cx="92" cy="22" r="7" fill="#f6c9b0"/>
          <ellipse cx="60" cy="100" rx="30" ry="28" fill="#d9a07a"/><ellipse cx="60" cy="106" rx="18" ry="18" fill="#f6c9b0"/>
          <circle cx="60" cy="48" r="34" fill="#d9a07a"/><ellipse cx="60" cy="58" rx="15" ry="11" fill="#f6c9b0"/>
          <circle cx="48" cy="42" r="3.5" fill="#4a2c2a"/><circle cx="72" cy="42" r="3.5" fill="#4a2c2a"/>
          <ellipse cx="60" cy="53" rx="5" ry="3.5" fill="#4a2c2a"/>
          <path d="M54 62 Q60 67 66 62" stroke="#4a2c2a" stroke-width="2" fill="none" stroke-linecap="round"/>
          <circle cx="40" cy="55" r="5" fill="#ff9fb8" opacity=".6"/><circle cx="80" cy="55" r="5" fill="#ff9fb8" opacity=".6"/>
          <path d="M60 82 l-8 -6 v10 z M60 82 l8 -6 v10 z" fill="#ff5f8f"/><circle cx="60" cy="82" r="3" fill="#ff5f8f"/>
        </svg>
      </div>
    </div>

    <div class="keypad-card" id="keypadCard">
      <p class="enter">ENTER PASSWORD 🔒</p>
      <div class="dots" id="dots"></div>
      <p class="msg" id="pwMsg">Hint: it's a special date 💕</p>
      <div class="keys" id="keys"></div>
      <div class="keys-extra">
        <button class="key small" id="delKey">⌫ Delete</button>
        <button class="key small" id="clrKey">Clear</button>
      </div>
    </div>
  </div>
</section>

<!-- ============ PAGE 3: BIRTHDAY LETTER ============ -->
<section class="page scrapbook" id="page3">
  <h1 class="script title">Happy Birthday, Zainab! 🎂❤️</h1>
  <div class="scrap-layout">
    <div class="polaroids" id="polaroids"></div>

    <div class="letter-wrap">
      <div class="ribbon" aria-hidden="true">🎀</div>
      <div class="letter" id="letter"><div id="letterText"></div></div>
      <div class="cake" aria-hidden="true">
        <svg viewBox="0 0 120 120">
          <ellipse cx="60" cy="108" rx="52" ry="8" fill="#f3c7d3"/>
          <rect x="14" y="62" width="92" height="44" rx="10" fill="#ffd1dc"/>
          <path d="M14 74 q10 14 20 0 q10 14 20 0 q10 14 20 0 q10 14 20 0 q10 14 12 0 v-12 h-92z" fill="#fff"/>
          <rect x="28" y="38" width="64" height="30" rx="9" fill="#ff9fb8"/>
          <path d="M28 50 q8 12 16 0 q8 12 16 0 q8 12 16 0 q8 12 16 0 v-12 h-64z" fill="#fff"/>
          <rect x="57" y="18" width="6" height="20" rx="2" fill="#ffe08a"/>
          <path class="flame" d="M60 6 q7 8 0 14 q-7 -6 0 -14z" fill="#ffb53d"/>
          <circle cx="36" cy="92" r="4" fill="#ff5f8f"/><circle cx="60" cy="96" r="4" fill="#ff5f8f"/><circle cx="84" cy="92" r="4" fill="#ff5f8f"/>
        </svg>
      </div>
      <button class="btn yes final-btn" id="finalBtn">Open Your Final Surprise 💌</button>
    </div>
  </div>
</section>

<!-- Final surprise popup -->
<div id="finalModal" class="modal" role="dialog" aria-modal="true">
  <div class="modal-card">
    <div class="envelope">💌</div>
    <h2 class="script" id="finalTitle"></h2>
    <p id="finalText"></p>
    <button class="btn yes" id="closeFinal">Close 💗</button>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
